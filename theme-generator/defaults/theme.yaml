typography:
  ui_family: "JetBrains Mono Nerd Font Propo"
  mono_family: "JetBrains Mono Nerd Font"
  body_size: 13
  readout_size: "{{typography.body_size}}"
  weight: 700
  style: "Bold"

desktop:
  icon_theme: "Yaru-purple"
  cursor_theme: "Adwaita"

metrics:
  spacing:
    compact: 3
    small: 6
    medium: 8
    large: 10
    xlarge: 12
    xxlarge: 14
  radius:
    entry: 4
    tooltip: 6
    control: 8
    popup: 10
  border:
    standard: 2
    subtle: 1
  opacity:
    header_accent: 0.3
    selection_accent: 0.16

motion:
  surface: 140

wallpaper:
  generate_default: false
  background: "{{base.background}}"
  accent: "{{accent.primary.base}}"
  accent_dim: "{{accent.primary.soft}}"

# Colors some consumers take by role. A theme points one at another palette
# value when the default role does not suit its palette.
terminal:
  # Selected text in foot and Ghostty
  selection_fg: "{{base.background}}"
  selection_bg: "{{ui.cursor}}"

btop:
  # Text color; empty leaves btop's own default
  main_fg: ""
  # Highlighted keys and the start of the memory, network, and process graphs
  highlight: "{{accent.secondary.soft}}"

wifitui:
  subtle: "{{accent.secondary.soft}}"

qt:
  # Selection highlight in the Qt palettes
  highlight: "{{accent.secondary.base}}"
  # Placeholder text and disabled selected text, each with its opacity as a
  # two-digit hex alpha
  placeholder: "{{base.foreground_muted}}"
  placeholder_alpha: "80"
  placeholder_disabled: "{{base.foreground_dim}}"
  placeholder_disabled_alpha: "80"
  highlighted_text_disabled: "{{base.foreground}}"
  highlighted_text_disabled_alpha: "66"

yazi:
  progress_error_fg: "{{status.warning}}"

nvim:
  # Empty keeps the template's own choice: the surface color for terminal
  # color 8, and the background on the primary accent for search matches
  terminal_color_8: ""
  search_fg: ""
  search_bg: ""

gtk:
  # Colloid's theme accent and link color
  accent: "{{accent.secondary.base}}"
  accent_bright: "{{accent.secondary.bright}}"

# A small crop of the theme's painting, for consumers that show a piece of it
# (T3 Code's sidebar). wallpaper names a file in the theme's wallpapers; empty
# shows none. crop is left, top, width, and height as fractions of the image.
artwork:
  wallpaper: ""
  crop: [0, 0, 1, 1]

# T3 Code's theme file. T3 derives a palette from canvas and accent and tints
# its surfaces with the accent; colors pins the surfaces to the theme's own
# layers so the painting's ground shows. Any other T3 role or a css key can be
# added.
t3code:
  version: 1
  name: "Hyprkarl"
  appearance: "{{mode}}"
  canvas: "{{base.background}}"
  accent: "{{accent.primary.bright}}"
  colors:
    chrome: "{{base.background}}"
    toolbar: "{{base.background}}"
    surface: "{{base.layer1}}"
    surfaceRaised: "{{base.layer2}}"
    surfaceOverlay: "{{base.layer2}}"
    text: "{{base.foreground}}"
    textMuted: "{{base.foreground_muted}}"
    border: "{{base.layer4}}"
    input: "{{base.layer4}}"
    focus: "{{accent.primary.bright}}"
    muted: "{{base.layer2}}"
    mutedForeground: "{{base.foreground_muted}}"
    secondary: "{{base.layer3}}"
    secondaryForeground: "{{base.foreground}}"
    accentSurface: "{{accent.primary.soft}}"
    accentSurfaceForeground: "{{base.foreground}}"
    messageSurface: "{{accent.primary.soft}}"
    messageForeground: "{{base.foreground}}"
    messageAction: "{{accent.secondary.bright}}"
    messageActionForeground: "{{base.background}}"
    messageActionHover: "{{accent.secondary.base}}"
    codeBackground: "{{base.layer1}}"
    codeForeground: "{{base.foreground}}"
    sidebar: "{{base.layer1}}"
    sidebarForeground: "{{base.foreground}}"
    sidebarMutedForeground: "{{base.foreground_muted}}"
    sidebarControlSurface: "{{base.layer2}}"
    sidebarRowHover: "{{base.layer2}}"
    sidebarRowActive: "{{base.layer3}}"
    sidebarRowSelected: "{{accent.primary.soft}}"
    sidebarBorder: "{{base.layer3}}"
    error: "{{status.error}}"
    warning: "{{status.warning}}"
    terminalBackground: "{{base.background}}"
    terminalForeground: "{{base.foreground}}"
    terminalCursor: "{{ui.cursor}}"
    terminalSelection: "{{base.layer4}}"

fastfetch:
  logo:
    mark: "{{accent.primary.bright}}"
    wordmark: "{{accent.secondary.bright}}"
  labels: "{{accent.tertiary.base}}"
  title: "{{accent.primary.bright}}"
  modules:
    - title
    - separator
    - os
    - host
    - kernel
    - uptime
    - packages
    - shell
    - display
    - wm
    - cpu
    - gpu
    - memory
    - disk
    - break
    - colors

shell:
  palette:
    foreground: "{{ui.text_secondary}}"
    muted: "{{base.foreground_muted}}"
    accent: "{{accent.primary.bright}}"
    border: "{{base.layer4}}"
    urgent: "{{status.error}}"
    warning: "{{status.warning}}"

  surfaces:
    window: "#00000000"
    bar: "{{base.background}}"
    popup: "{{base.background}}"
    tooltip: "{{base.background}}"
    notification: "{{base.background}}"
    control: "#00000000"

  typography:
    uiFamily: "{{typography.ui_family}}"
    monoFamily: "{{typography.mono_family}}"
    bodySize: "{{typography.body_size}}"
    readoutSize: "{{typography.readout_size}}"
    weight: "{{typography.weight}}"
    style: "{{typography.style}}"

  metrics:
    radius: "{{metrics.radius.control}}"
    borderWidth: "{{metrics.border.standard}}"
    controlPadding: "{{metrics.spacing.medium}}"

  switch:
    trackLength: 24
    trackHeight: 12
    trackRadius: 6
    thumbSize: 16
    thumbRadius: 8
    thumbPadding: 7
    borderWidth: "{{metrics.border.standard}}"
    filled: false
    fontFamily: "{{shell.typography.uiFamily}}"
    fontSize: 9
    onGlyphOffset: [0, 0]
    offGlyphOffset: [0, 0]
    transitionDuration: "{{motion.surface}}"

  bar:
    minimumThickness: 22
    showDividers: true
    widgetPadding:
      main: "{{metrics.spacing.small}}"
      cross: "{{metrics.spacing.compact}}"
    trayPaddingOffset: -2
    margin:
      screen: 0
      outer: 0
      content: 0
    island:
      radius: "{{metrics.radius.control}}"
      curveSize: "{{metrics.spacing.xlarge}}"
      curveRadius: "{{metrics.radius.entry}}"
      corners:
        screenOuter: "square"
        screenInner: "curve"
        contentOuter: "square"
        contentInner: "round"
      borders:
        screen: false
        content: true
        outer: false
        inner: true

  panel:
    gap: 0
    width: 360
    powerWidth: 320
    padding: "{{metrics.spacing.xlarge}}"
    spacing: "{{metrics.spacing.large}}"
    background: "{{shell.surfaces.popup}}"
    sectionBackground: "{{base.surface_soft}}"
    foreground: "{{shell.palette.foreground}}"
    accent: "{{shell.palette.accent}}"
    border: "{{shell.palette.border}}"
    font: "{{shell.typography.uiFamily}}"
    fontSize: "{{shell.typography.bodySize}}"
    fontWeight: "{{shell.typography.weight}}"
    outerRadius: "{{metrics.radius.popup}}"
    innerRadius: "{{metrics.radius.tooltip}}"
    entryRadius: "{{metrics.radius.entry}}"
    outerBorderWidth: "{{metrics.border.standard}}"
    outerPadding: "{{metrics.spacing.small}}"
    innerBorderWidth: "{{metrics.border.standard}}"
    headerPadding: "{{metrics.spacing.small}}"
    entryPadding: "{{metrics.spacing.medium}}"
    selectionBorderWidth: "{{metrics.border.subtle}}"
    headerAccentOpacity: "{{metrics.opacity.header_accent}}"
    selectionAccentOpacity: "{{metrics.opacity.selection_accent}}"
    transitionDuration: "{{motion.surface}}"

  tooltip:
    radius: "{{metrics.radius.tooltip}}"

  osd:
    width: 300
    mediaWidth: 380
    padding: "{{metrics.spacing.xlarge}}"
    spacing: "{{metrics.spacing.large}}"
    radius: "{{metrics.radius.popup}}"
    iconSize: 20
    progressHeight: "{{metrics.spacing.small}}"
    transitionDuration: "{{motion.surface}}"

  notification:
    width: 420
    compactWidth: "{{shell.notification.width // 2}}"
    padding: "{{metrics.spacing.large}}"
    spacing: "{{metrics.spacing.medium}}"
    stackSpacing: 0
    radius: "{{metrics.radius.popup}}"
    iconSize: 32
    indicatorScale: 1.5
    progressHeight: "{{metrics.spacing.small}}"
    transitionDuration: "{{motion.surface}}"

  polkit:
    width: 440
    padding: "{{metrics.spacing.xxlarge}}"
    spacing: "{{metrics.spacing.large}}"
    radius: "{{metrics.radius.popup}}"
    iconSize: 36
    headerAccentOpacity: "{{metrics.opacity.header_accent}}"
    transitionDuration: "{{motion.surface}}"

  lock:
    width: 400
    padding: "{{metrics.spacing.xxlarge}}"
    spacing: "{{metrics.spacing.large}}"
    radius: "{{metrics.radius.popup}}"
    inputHeight: 64
    inputFontSize: 28
    clockFontSize: 64
    dateFontSize: 24
    dimOpacity: 0.6
    clockFormat: "hh:mm AP"
    dateFormat: "dddd, MMMM d"
    transitionDuration: "{{motion.surface}}"
    fadeDuration: 300
    failureDuration: 1000
    fingerprintSize: 40
    fingerprintCompleteDuration: 450

  menu:
    background: "{{shell.surfaces.popup}}"
    foreground: "{{shell.palette.foreground}}"
    accent: "{{shell.palette.accent}}"
    border: "{{shell.palette.border}}"
    scrim: "#22000000"
    font: "{{shell.typography.uiFamily}}"
    fontSize: 14
    fontWeight: "{{shell.typography.weight}}"
    width: 280
    searchWidth: "{{shell.menu.width * 2}}"
    referenceWidth: 800
    searchRows: 10
    outerRadius: "{{metrics.radius.popup}}"
    innerRadius: "{{metrics.radius.tooltip}}"
    entryRadius: "{{metrics.radius.entry}}"
    outerBorderWidth: "{{metrics.border.standard}}"
    outerPadding: "{{metrics.spacing.small}}"
    innerBorderWidth: "{{metrics.border.standard}}"
    headerPadding: "{{metrics.spacing.small}}"
    entryMargin: "{{metrics.radius.entry}}"
    entryPadding: 7
    selectionBorderWidth: "{{metrics.border.subtle}}"
    headerAccentOpacity: "{{metrics.opacity.header_accent}}"
    selectionAccentOpacity: "{{metrics.opacity.selection_accent}}"

  applicationPicker:
    width: 400
    rows: 7
    iconSize: 32

  calculator:
    width: 480
    historyRows: 5

  wallpaperPicker:
    widthScreenFraction: 0.82
    previewHeightScreenFraction: 0.42
    previewAspectRatio: 1.7777777778
    carouselRadiusWidthFraction: 0.48
    sideScale: 0.78
    sideOpacity: 0.55
    gap: "{{metrics.spacing.xxlarge}}"

  displayArrangement:
    width: 960
    height: 600
    bezelFraction: 0.08
