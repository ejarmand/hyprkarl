# Inspired by Vincent van Gogh; see SOURCES.md for the artwork and palette decisions.
base:
  background: '#121a2e'
  layer0: '{{base.background}}'
  layer1: '#182139'
  layer2: '#1f2943'
  layer3: '#27314e'
  layer4: '#2f3a59'
  surface_soft: '{{base.layer1}}'
  surface: '{{base.layer2}}'
  surface_alt: '{{base.layer4}}'
  foreground: '#f2ede0'
  foreground_muted: '#d6d1c5'
  foreground_dim: '#bab6ac'
ansi:
  black: '#121a2e'
  red: '#ef8e62'
  green: '#8fcf6a'
  yellow: '#f0d050'
  blue: '#86a8f4'
  magenta: '#bca6ee'
  cyan: '#9fd8e0'
  white: '#ddd8cc'
bright:
  black: '#bab6ac'
  red: '#ffac86'
  green: '#ace690'
  yellow: '#fce67a'
  blue: '#aac2ff'
  magenta: '#d6c2ff'
  cyan: '#bfeaf0'
  white: '#fffbf0'
accent:
  primary:
    base: '{{ansi.yellow}}'
    soft: '{{mix(base.background, ansi.yellow, 25)}}'
    bright: '{{bright.yellow}}'
  secondary:
    base: '{{ansi.blue}}'
    soft: '{{mix(base.background, ansi.blue, 25)}}'
    bright: '{{bright.blue}}'
  tertiary:
    base: '{{ansi.red}}'
    soft: '{{mix(base.background, ansi.red, 25)}}'
    bright: '{{bright.red}}'
status:
  success: '{{ansi.green}}'
  warning: '{{ansi.yellow}}'
  error: '{{ansi.red}}'
  urgent: '{{bright.red}}'
ui:
  cursor: '{{accent.primary.base}}'
  text: '{{base.foreground}}'
  text_secondary: '{{base.foreground_muted}}'
  selection_bg: '{{accent.primary.base}}'
  selection_fg: '{{base.background}}'
  panel: '{{base.surface}}'
  border: '{{accent.primary.base}}'
  border_inner: '{{base.foreground_dim}}'
  border_soft: '{{accent.primary.soft}}'
  highlight: '{{accent.primary.bright}}'
