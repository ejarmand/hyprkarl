# Merged with the user's prompt by hk-starship-reload.
# Light painting accents carry dark text, as in vera-dark; surface segments carry cream.
[palettes.hyprkarl]
color_fg0 = '{{base.background}}'
color_fg1 = '{{base.foreground}}'
color_fg2 = '{{accent.primary.bright}}'
color_bg1 = '{{base.surface}}'
color_bg3 = '{{base.surface_alt}}'
color_magenta = '{{saturate(ansi.magenta, 15)}}'
color_purple = '{{bright.magenta}}'
color_orange = '{{saturate(ansi.red, 25)}}'
color_yellow = '{{saturate(ansi.yellow, 15)}}'
color_aqua = '{{saturate(ansi.cyan, 15)}}'
color_blue = '{{saturate(ansi.blue, 15)}}'
color_green = '{{bright.green}}'
color_red = '{{bright.red}}'
