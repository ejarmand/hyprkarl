# Lady with a Hat and Feather Boa. Artwork-inspired colours adapted for dark desktop contrast.
base:
  background: '#191418'
  layer0: '{{base.background}}'
  layer1: '#231c22'
  layer2: '#2d252e'
  layer3: '#382e39'
  layer4: '#413645'
  surface_soft: '{{base.layer1}}'
  surface: '{{base.layer2}}'
  surface_alt: '{{base.layer4}}'
  foreground: '#eee0d1'
  foreground_muted: '#cfb8ad'
  foreground_dim: '#b8a8b1'
ansi:
  black: '#191418'
  red: '#e18e81'
  green: '#b2bca0'
  yellow: '#d9b785'
  blue: '#b7a5cf'
  magenta: '#ca9fce'
  cyan: '#a2bcb8'
  white: '#dccbbc'
bright:
  black: '#b8a8b1'
  red: '#f1b2a1'
  green: '#c9d1b7'
  yellow: '#efd1a3'
  blue: '#d0bce9'
  magenta: '#e3bde5'
  cyan: '#bed5d0'
  white: '#fff0e1'
accent:
  primary:
    base: '{{ansi.blue}}'
    soft: '{{mix(base.background, ansi.blue, 25)}}'
    bright: '{{bright.blue}}'
  secondary:
    base: '{{ansi.red}}'
    soft: '{{mix(base.background, ansi.red, 25)}}'
    bright: '{{bright.red}}'
  tertiary:
    base: '{{ansi.yellow}}'
    soft: '{{mix(base.background, ansi.yellow, 25)}}'
    bright: '{{bright.yellow}}'
status:
  success: '{{ansi.green}}'
  warning: '{{ansi.yellow}}'
  error: '{{ansi.red}}'
  urgent: '{{bright.red}}'
ui:
  cursor: '{{accent.primary.bright}}'
  text: '{{base.foreground}}'
  text_secondary: '{{base.foreground_muted}}'
  selection_bg: '{{accent.primary.base}}'
  selection_fg: '{{base.background}}'
  panel: '{{base.surface}}'
  border: '{{accent.primary.base}}'
  border_inner: '{{base.foreground_dim}}'
  border_soft: '{{accent.primary.soft}}'
  highlight: '{{accent.primary.bright}}'
