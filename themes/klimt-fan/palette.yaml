# Inspired by Gustav Klimt; see SOURCES.md for the artwork and palette decisions.
base:
  background: '#171a24'
  layer0: '{{base.background}}'
  layer1: '#1e2230'
  layer2: '#262b3a'
  layer3: '#2e3445'
  layer4: '#373e50'
  surface_soft: '{{base.layer1}}'
  surface: '{{base.layer2}}'
  surface_alt: '{{base.layer4}}'
  foreground: '#f3ead6'
  foreground_muted: '#d8cfbb'
  foreground_dim: '#bdb7a8'
ansi:
  black: '#171a24'
  red: '#f7926a'
  green: '#9fd08a'
  yellow: '#f2cd4a'
  blue: '#97adf4'
  magenta: '#eaa0c0'
  cyan: '#6ec4c8'
  white: '#e0d8c6'
bright:
  black: '#bdb7a8'
  red: '#ffa890'
  green: '#bce6a8'
  yellow: '#ffe27a'
  blue: '#b0c2ff'
  magenta: '#ffbfd9'
  cyan: '#9de6dd'
  white: '#fffaec'
accent:
  primary:
    base: '{{ansi.yellow}}'
    soft: '{{mix(base.background, ansi.yellow, 25)}}'
    bright: '{{bright.yellow}}'
  secondary:
    base: '{{ansi.cyan}}'
    soft: '{{mix(base.background, ansi.cyan, 25)}}'
    bright: '{{bright.cyan}}'
  tertiary:
    base: '{{ansi.red}}'
    soft: '{{mix(base.background, ansi.red, 25)}}'
    bright: '{{bright.red}}'
status:
  success: '{{ansi.green}}'
  warning: '{{ansi.yellow}}'
  error: '{{ansi.red}}'
  urgent: '{{bright.red}}'
ui:
  cursor: '{{accent.primary.base}}'
  text: '{{base.foreground}}'
  text_secondary: '{{base.foreground_muted}}'
  selection_bg: '{{accent.primary.base}}'
  selection_fg: '{{base.background}}'
  panel: '{{base.surface}}'
  border: '{{accent.primary.base}}'
  border_inner: '{{base.foreground_dim}}'
  border_soft: '{{accent.primary.soft}}'
  highlight: '{{accent.primary.bright}}'
