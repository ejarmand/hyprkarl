# Inspired by Vincent van Gogh; see SOURCES.md for the artwork and palette decisions.
base:
  background: '#10201c'
  layer0: '{{base.background}}'
  layer1: '#162924'
  layer2: '#1d312c'
  layer3: '#243a34'
  layer4: '#2c443d'
  surface_soft: '{{base.layer1}}'
  surface: '{{base.layer2}}'
  surface_alt: '{{base.layer4}}'
  foreground: '#f1ebdf'
  foreground_muted: '#d5cfc3'
  foreground_dim: '#b9b4a9'
ansi:
  black: '#10201c'
  red: '#fa9478'
  green: '#9ad488'
  yellow: '#f2a85a'
  blue: '#92aef2'
  magenta: '#e8a2b6'
  cyan: '#66c6b0'
  white: '#dcd6ca'
bright:
  black: '#b9b4a9'
  red: '#ffa48a'
  green: '#a0e6b2'
  yellow: '#ffc482'
  blue: '#b0c4ff'
  magenta: '#ffbecf'
  cyan: '#92e4da'
  white: '#fdf9ee'
accent:
  primary:
    base: '{{ansi.yellow}}'
    soft: '{{mix(base.background, ansi.yellow, 25)}}'
    bright: '{{bright.yellow}}'
  secondary:
    base: '{{ansi.cyan}}'
    soft: '{{mix(base.background, ansi.cyan, 25)}}'
    bright: '{{bright.cyan}}'
  tertiary:
    base: '{{ansi.red}}'
    soft: '{{mix(base.background, ansi.red, 25)}}'
    bright: '{{bright.red}}'
status:
  success: '{{ansi.green}}'
  warning: '{{ansi.yellow}}'
  error: '{{ansi.red}}'
  urgent: '{{bright.red}}'
ui:
  cursor: '{{accent.primary.base}}'
  text: '{{base.foreground}}'
  text_secondary: '{{base.foreground_muted}}'
  selection_bg: '{{accent.primary.base}}'
  selection_fg: '{{base.background}}'
  panel: '{{base.surface}}'
  border: '{{accent.primary.base}}'
  border_inner: '{{base.foreground_dim}}'
  border_soft: '{{accent.primary.soft}}'
  highlight: '{{accent.primary.bright}}'
