# Inspired by Gustav Klimt; see SOURCES.md for the artwork and palette decisions.
base:
  background: '#212518'
  layer0: '{{base.background}}'
  layer1: '#282d1e'
  layer2: '#303624'
  layer3: '#383e2b'
  layer4: '#404633'
  surface_soft: '{{base.layer1}}'
  surface: '{{base.layer2}}'
  surface_alt: '{{base.layer4}}'
  foreground: '#f6e8c5'
  foreground_muted: '#d8cdb2'
  foreground_dim: '#bec1a6'
ansi:
  black: '#212518'
  red: '#efa387'
  green: '#b4ce86'
  yellow: '#edc565'
  blue: '#a9b9e9'
  magenta: '#dca8d2'
  cyan: '#94cbc0'
  white: '#e4d6b7'
bright:
  black: '#bec1a6'
  red: '#ffc3a6'
  green: '#cce5a5'
  yellow: '#ffdf88'
  blue: '#c4cef8'
  magenta: '#f0c4e5'
  cyan: '#b6e4d7'
  white: '#fff5dc'
accent:
  primary:
    base: '{{ansi.yellow}}'
    soft: '{{mix(base.background, ansi.yellow, 25)}}'
    bright: '{{bright.yellow}}'
  secondary:
    base: '{{ansi.red}}'
    soft: '{{mix(base.background, ansi.red, 25)}}'
    bright: '{{bright.red}}'
  tertiary:
    base: '{{ansi.green}}'
    soft: '{{mix(base.background, ansi.green, 25)}}'
    bright: '{{bright.green}}'
status:
  success: '{{ansi.green}}'
  warning: '{{ansi.yellow}}'
  error: '{{ansi.red}}'
  urgent: '{{bright.red}}'
ui:
  cursor: '{{accent.primary.base}}'
  text: '{{base.foreground}}'
  text_secondary: '{{base.foreground_muted}}'
  selection_bg: '{{accent.primary.base}}'
  selection_fg: '{{base.background}}'
  panel: '{{base.surface}}'
  border: '{{accent.primary.base}}'
  border_inner: '{{base.foreground_dim}}'
  border_soft: '{{accent.primary.soft}}'
  highlight: '{{accent.primary.bright}}'
