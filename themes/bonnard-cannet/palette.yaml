# Inspired by Pierre Bonnard; see SOURCES.md for the artwork and palette decisions.
base:
  background: '#1a1c26'
  layer0: '{{base.background}}'
  layer1: '#212431'
  layer2: '#292d3b'
  layer3: '#323746'
  layer4: '#3b4152'
  surface_soft: '{{base.layer1}}'
  surface: '{{base.layer2}}'
  surface_alt: '{{base.layer4}}'
  foreground: '#f4ecdc'
  foreground_muted: '#d8d0c0'
  foreground_dim: '#bcb6aa'
ansi:
  black: '#1a1c26'
  red: '#f79478'
  green: '#a6d06a'
  yellow: '#f4a83c'
  blue: '#8ab4f0'
  magenta: '#ef9ac4'
  cyan: '#7fcfd2'
  white: '#e2dacb'
bright:
  black: '#bcb6aa'
  red: '#ffa98c'
  green: '#c2e68e'
  yellow: '#ffc46a'
  blue: '#acccff'
  magenta: '#ffb8d8'
  cyan: '#a2e6e6'
  white: '#fffaef'
accent:
  primary:
    base: '{{ansi.yellow}}'
    soft: '{{mix(base.background, ansi.yellow, 25)}}'
    bright: '{{bright.yellow}}'
  secondary:
    base: '{{ansi.blue}}'
    soft: '{{mix(base.background, ansi.blue, 25)}}'
    bright: '{{bright.blue}}'
  tertiary:
    base: '{{ansi.green}}'
    soft: '{{mix(base.background, ansi.green, 25)}}'
    bright: '{{bright.green}}'
status:
  success: '{{ansi.green}}'
  warning: '{{ansi.yellow}}'
  error: '{{ansi.red}}'
  urgent: '{{bright.red}}'
ui:
  cursor: '{{accent.primary.base}}'
  text: '{{base.foreground}}'
  text_secondary: '{{base.foreground_muted}}'
  selection_bg: '{{accent.primary.base}}'
  selection_fg: '{{base.background}}'
  panel: '{{base.surface}}'
  border: '{{accent.primary.base}}'
  border_inner: '{{base.foreground_dim}}'
  border_soft: '{{accent.primary.soft}}'
  highlight: '{{accent.primary.bright}}'
