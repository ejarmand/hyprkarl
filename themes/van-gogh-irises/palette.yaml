# Inspired by Vincent van Gogh; see SOURCES.md for the artwork and palette decisions.
base:
  background: '#141c1b'
  layer0: '{{base.background}}'
  layer1: '#1a2423'
  layer2: '#212c2b'
  layer3: '#293533'
  layer4: '#313e3c'
  surface_soft: '{{base.layer1}}'
  surface: '{{base.layer2}}'
  surface_alt: '{{base.layer4}}'
  foreground: '#efeadc'
  foreground_muted: '#d3cfc1'
  foreground_dim: '#b8b5a8'
ansi:
  black: '#141c1b'
  red: '#ee9670'
  green: '#88c4aa'
  yellow: '#f2a65a'
  blue: '#98a6f6'
  magenta: '#b89af0'
  cyan: '#7fc8b8'
  white: '#dcd8cb'
bright:
  black: '#b8b5a8'
  red: '#ffb292'
  green: '#aadfb6'
  yellow: '#ffc082'
  blue: '#b2bcff'
  magenta: '#d2b8ff'
  cyan: '#a0e0d2'
  white: '#fcf8ec'
accent:
  primary:
    base: '{{ansi.blue}}'
    soft: '{{mix(base.background, ansi.blue, 25)}}'
    bright: '{{bright.blue}}'
  secondary:
    base: '{{ansi.green}}'
    soft: '{{mix(base.background, ansi.green, 25)}}'
    bright: '{{bright.green}}'
  tertiary:
    base: '{{ansi.yellow}}'
    soft: '{{mix(base.background, ansi.yellow, 25)}}'
    bright: '{{bright.yellow}}'
status:
  success: '{{ansi.green}}'
  warning: '{{ansi.yellow}}'
  error: '{{ansi.red}}'
  urgent: '{{bright.red}}'
ui:
  cursor: '{{accent.primary.base}}'
  text: '{{base.foreground}}'
  text_secondary: '{{base.foreground_muted}}'
  selection_bg: '{{accent.primary.base}}'
  selection_fg: '{{base.background}}'
  panel: '{{base.surface}}'
  border: '{{accent.primary.base}}'
  border_inner: '{{base.foreground_dim}}'
  border_soft: '{{accent.primary.soft}}'
  highlight: '{{accent.primary.bright}}'
