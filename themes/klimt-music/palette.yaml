# Inspired by Gustav Klimt; see SOURCES.md for the artwork and palette decisions.
base:
  background: '#19272b'
  layer0: '{{base.background}}'
  layer1: '#202e33'
  layer2: '#29383e'
  layer3: '#314249'
  layer4: '#394c52'
  surface_soft: '{{base.layer1}}'
  surface: '{{base.layer2}}'
  surface_alt: '{{base.layer4}}'
  foreground: '#f1e7d5'
  foreground_muted: '#d1c8b7'
  foreground_dim: '#bdc0b5'
ansi:
  black: '#19272b'
  red: '#e7afa5'
  green: '#b1c8a0'
  yellow: '#dfbb72'
  blue: '#acc3db'
  magenta: '#d6b0c9'
  cyan: '#a1c9c4'
  white: '#d9d0bd'
bright:
  black: '#bdc0b5'
  red: '#f4c5bc'
  green: '#c8dbb8'
  yellow: '#f0d395'
  blue: '#c4d8ea'
  magenta: '#e9c7df'
  cyan: '#bee0d8'
  white: '#fff6e6'
accent:
  primary:
    base: '{{ansi.yellow}}'
    soft: '{{mix(base.background, ansi.yellow, 25)}}'
    bright: '{{bright.yellow}}'
  secondary:
    base: '{{ansi.magenta}}'
    soft: '{{mix(base.background, ansi.magenta, 25)}}'
    bright: '{{bright.magenta}}'
  tertiary:
    base: '{{ansi.cyan}}'
    soft: '{{mix(base.background, ansi.cyan, 25)}}'
    bright: '{{bright.cyan}}'
status:
  success: '{{ansi.green}}'
  warning: '{{ansi.yellow}}'
  error: '{{ansi.red}}'
  urgent: '{{bright.red}}'
ui:
  cursor: '{{accent.primary.base}}'
  text: '{{base.foreground}}'
  text_secondary: '{{base.foreground_muted}}'
  selection_bg: '{{accent.primary.base}}'
  selection_fg: '{{base.background}}'
  panel: '{{base.surface}}'
  border: '{{accent.primary.base}}'
  border_inner: '{{base.foreground_dim}}'
  border_soft: '{{accent.primary.soft}}'
  highlight: '{{accent.primary.bright}}'
