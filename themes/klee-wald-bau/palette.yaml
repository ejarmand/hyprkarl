# Inspired by Paul Klee; see SOURCES.md for the artwork and palette decisions.
base:
  background: '#1c1716'
  layer0: '{{base.background}}'
  layer1: '#231d1c'
  layer2: '#2b2423'
  layer3: '#342c2a'
  layer4: '#3d3432'
  surface_soft: '{{base.layer1}}'
  surface: '{{base.layer2}}'
  surface_alt: '{{base.layer4}}'
  foreground: '#efe6dc'
  foreground_muted: '#d4cabf'
  foreground_dim: '#b9afa5'
ansi:
  black: '#1c1716'
  red: '#ec8a6c'
  green: '#6fd39a'
  yellow: '#e2b86a'
  blue: '#a2a6e4'
  magenta: '#e59ab2'
  cyan: '#7fcfc0'
  white: '#ddd3c8'
bright:
  black: '#b9afa5'
  red: '#ffa88c'
  green: '#94eab6'
  yellow: '#f6d08e'
  blue: '#c0c4ff'
  magenta: '#ffb8cc'
  cyan: '#a2e6d8'
  white: '#fff6ea'
accent:
  primary:
    base: '{{ansi.green}}'
    soft: '{{mix(base.background, ansi.green, 25)}}'
    bright: '{{bright.green}}'
  secondary:
    base: '{{ansi.red}}'
    soft: '{{mix(base.background, ansi.red, 25)}}'
    bright: '{{bright.red}}'
  tertiary:
    base: '{{ansi.blue}}'
    soft: '{{mix(base.background, ansi.blue, 25)}}'
    bright: '{{bright.blue}}'
status:
  success: '{{ansi.green}}'
  warning: '{{ansi.yellow}}'
  error: '{{ansi.red}}'
  urgent: '{{bright.red}}'
ui:
  cursor: '{{accent.primary.base}}'
  text: '{{base.foreground}}'
  text_secondary: '{{base.foreground_muted}}'
  selection_bg: '{{accent.primary.base}}'
  selection_fg: '{{base.background}}'
  panel: '{{base.surface}}'
  border: '{{accent.primary.base}}'
  border_inner: '{{base.foreground_dim}}'
  border_soft: '{{accent.primary.soft}}'
  highlight: '{{accent.primary.bright}}'
