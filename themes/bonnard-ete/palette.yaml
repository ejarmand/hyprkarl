# Inspired by Pierre Bonnard; see SOURCES.md for the artwork and palette decisions.
base:
  background: '#121c1e'
  layer0: '{{base.background}}'
  layer1: '#182427'
  layer2: '#1f2c2f'
  layer3: '#273438'
  layer4: '#2f3d41'
  surface_soft: '{{base.layer1}}'
  surface: '{{base.layer2}}'
  surface_alt: '{{base.layer4}}'
  foreground: '#f0ecdf'
  foreground_muted: '#d4d0c4'
  foreground_dim: '#b8b5aa'
ansi:
  black: '#121c1e'
  red: '#f4983c'
  green: '#88d84e'
  yellow: '#e8d88a'
  blue: '#8aa6f2'
  magenta: '#bcaaf0'
  cyan: '#6cc4b0'
  white: '#dcd8cc'
bright:
  black: '#b8b5aa'
  red: '#ffb466'
  green: '#a8ec74'
  yellow: '#f8eaaa'
  blue: '#acc0ff'
  magenta: '#d4c4ff'
  cyan: '#90dccc'
  white: '#fcf9ee'
accent:
  primary:
    base: '{{ansi.green}}'
    soft: '{{mix(base.background, ansi.green, 25)}}'
    bright: '{{bright.green}}'
  secondary:
    base: '{{ansi.red}}'
    soft: '{{mix(base.background, ansi.red, 25)}}'
    bright: '{{bright.red}}'
  tertiary:
    base: '{{ansi.blue}}'
    soft: '{{mix(base.background, ansi.blue, 25)}}'
    bright: '{{bright.blue}}'
status:
  success: '{{ansi.green}}'
  warning: '{{ansi.yellow}}'
  error: '{{ansi.red}}'
  urgent: '{{bright.red}}'
ui:
  cursor: '{{accent.primary.base}}'
  text: '{{base.foreground}}'
  text_secondary: '{{base.foreground_muted}}'
  selection_bg: '{{accent.primary.base}}'
  selection_fg: '{{base.background}}'
  panel: '{{base.surface}}'
  border: '{{accent.primary.base}}'
  border_inner: '{{base.foreground_dim}}'
  border_soft: '{{accent.primary.soft}}'
  highlight: '{{accent.primary.bright}}'
