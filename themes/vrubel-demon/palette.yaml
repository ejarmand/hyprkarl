# Inspired by Mikhail Vrubel; see SOURCES.md for the artwork and palette decisions.
base:
  background: '#18171f'
  layer0: '{{base.background}}'
  layer1: '#1f1e28'
  layer2: '#272631'
  layer3: '#2f2e3b'
  layer4: '#383745'
  surface_soft: '{{base.layer1}}'
  surface: '{{base.layer2}}'
  surface_alt: '{{base.layer4}}'
  foreground: '#f1e8e2'
  foreground_muted: '#d6ccc6'
  foreground_dim: '#bbb2ad'
ansi:
  black: '#18171f'
  red: '#f28a72'
  green: '#8cc0a0'
  yellow: '#f2b866'
  blue: '#86a4ee'
  magenta: '#c4b2e0'
  cyan: '#86c4d2'
  white: '#ddd5cf'
bright:
  black: '#bbb2ad'
  red: '#ffaa94'
  green: '#aad8bc'
  yellow: '#ffd08c'
  blue: '#a8c0ff'
  magenta: '#dccdf6'
  cyan: '#a8dce8'
  white: '#fff8f2'
accent:
  primary:
    base: '{{ansi.red}}'
    soft: '{{mix(base.background, ansi.red, 25)}}'
    bright: '{{bright.red}}'
  secondary:
    base: '{{ansi.blue}}'
    soft: '{{mix(base.background, ansi.blue, 25)}}'
    bright: '{{bright.blue}}'
  tertiary:
    base: '{{ansi.magenta}}'
    soft: '{{mix(base.background, ansi.magenta, 25)}}'
    bright: '{{bright.magenta}}'
status:
  success: '{{ansi.green}}'
  warning: '{{ansi.yellow}}'
  error: '{{ansi.red}}'
  urgent: '{{bright.red}}'
ui:
  cursor: '{{accent.primary.base}}'
  text: '{{base.foreground}}'
  text_secondary: '{{base.foreground_muted}}'
  selection_bg: '{{accent.primary.base}}'
  selection_fg: '{{base.background}}'
  panel: '{{base.surface}}'
  border: '{{accent.primary.base}}'
  border_inner: '{{base.foreground_dim}}'
  border_soft: '{{accent.primary.soft}}'
  highlight: '{{accent.primary.bright}}'
