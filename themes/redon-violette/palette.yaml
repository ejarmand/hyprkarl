# Inspired by Odilon Redon; see SOURCES.md for the artwork and palette decisions.
base:
  background: '#1d1a17'
  layer0: '{{base.background}}'
  layer1: '#24201c'
  layer2: '#2c2722'
  layer3: '#352f29'
  layer4: '#3e3730'
  surface_soft: '{{base.layer1}}'
  surface: '{{base.layer2}}'
  surface_alt: '{{base.layer4}}'
  foreground: '#efe7da'
  foreground_muted: '#d4cbbd'
  foreground_dim: '#b9b0a2'
ansi:
  black: '#1d1a17'
  red: '#f2a084'
  green: '#86d686'
  yellow: '#e4c56a'
  blue: '#8ea4f4'
  magenta: '#c194f2'
  cyan: '#96dcc4'
  white: '#ddd5c8'
bright:
  black: '#b9b0a2'
  red: '#ffbca2'
  green: '#a8ecaa'
  yellow: '#f8dc8e'
  blue: '#b0c0ff'
  magenta: '#d8b4ff'
  cyan: '#b6f0dc'
  white: '#fff7ea'
accent:
  primary:
    base: '{{ansi.magenta}}'
    soft: '{{mix(base.background, ansi.magenta, 25)}}'
    bright: '{{bright.magenta}}'
  secondary:
    base: '{{ansi.cyan}}'
    soft: '{{mix(base.background, ansi.cyan, 25)}}'
    bright: '{{bright.cyan}}'
  tertiary:
    base: '{{ansi.blue}}'
    soft: '{{mix(base.background, ansi.blue, 25)}}'
    bright: '{{bright.blue}}'
status:
  success: '{{ansi.green}}'
  warning: '{{ansi.yellow}}'
  error: '{{ansi.red}}'
  urgent: '{{bright.red}}'
ui:
  cursor: '{{accent.primary.base}}'
  text: '{{base.foreground}}'
  text_secondary: '{{base.foreground_muted}}'
  selection_bg: '{{accent.primary.base}}'
  selection_fg: '{{base.background}}'
  panel: '{{base.surface}}'
  border: '{{accent.primary.base}}'
  border_inner: '{{base.foreground_dim}}'
  border_soft: '{{accent.primary.soft}}'
  highlight: '{{accent.primary.bright}}'
