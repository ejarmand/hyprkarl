# Inspired by Paul Klee; see SOURCES.md for the artwork and palette decisions.
base:
  background: '#1f1714'
  layer0: '{{base.background}}'
  layer1: '#261d19'
  layer2: '#2e241f'
  layer3: '#372b25'
  layer4: '#40332c'
  surface_soft: '{{base.layer1}}'
  surface: '{{base.layer2}}'
  surface_alt: '{{base.layer4}}'
  foreground: '#f3e8d8'
  foreground_muted: '#d8ccbc'
  foreground_dim: '#bcb0a2'
ansi:
  black: '#1f1714'
  red: '#f28462'
  green: '#a6cf7a'
  yellow: '#f3a64a'
  blue: '#93a8d4'
  magenta: '#e6a0b6'
  cyan: '#6fc8b8'
  white: '#e0d4c4'
bright:
  black: '#bcb0a2'
  red: '#ffa486'
  green: '#c2e69c'
  yellow: '#ffc072'
  blue: '#b0c6ff'
  magenta: '#ffbed0'
  cyan: '#92e2d2'
  white: '#fff6e8'
accent:
  primary:
    base: '{{ansi.yellow}}'
    soft: '{{mix(base.background, ansi.yellow, 25)}}'
    bright: '{{bright.yellow}}'
  secondary:
    base: '{{ansi.cyan}}'
    soft: '{{mix(base.background, ansi.cyan, 25)}}'
    bright: '{{bright.cyan}}'
  tertiary:
    base: '{{ansi.red}}'
    soft: '{{mix(base.background, ansi.red, 25)}}'
    bright: '{{bright.red}}'
status:
  success: '{{ansi.green}}'
  warning: '{{ansi.yellow}}'
  error: '{{ansi.red}}'
  urgent: '{{bright.red}}'
ui:
  cursor: '{{accent.primary.base}}'
  text: '{{base.foreground}}'
  text_secondary: '{{base.foreground_muted}}'
  selection_bg: '{{accent.primary.base}}'
  selection_fg: '{{base.background}}'
  panel: '{{base.surface}}'
  border: '{{accent.primary.base}}'
  border_inner: '{{base.foreground_dim}}'
  border_soft: '{{accent.primary.soft}}'
  highlight: '{{accent.primary.bright}}'
