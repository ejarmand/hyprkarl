# Colors inspired by a private painting; the artwork is not distributed.
base:
  background: '#141e2a'
  layer0: '#141e2a'
  layer1: '#1c2937'
  layer2: '#263747'
  layer3: '#2d4153'
  layer4: '#364d60'
  surface_soft: '{{base.layer1}}'
  surface: '{{base.layer2}}'
  surface_alt: '{{base.layer4}}'
  foreground: '#edeade'
  foreground_muted: '#bcc9cf'
  foreground_dim: '#90a4b2'
ansi:
  black: '#141e2a'
  red: '#ef7c9c'
  green: '#82bfaa'
  yellow: '#e6cf8d'
  blue: '#86b6db'
  magenta: '#b4a0d4'
  cyan: '#83c6cb'
  white: '#c8d4db'
bright:
  black: '#90a4b2'
  red: '#ff9bb5'
  green: '#a4d5bd'
  yellow: '#f3dfaa'
  blue: '#a3cdf0'
  magenta: '#d0bde8'
  cyan: '#a2dde0'
  white: '#f6f3e9'
accent:
  primary:
    base: '{{ansi.blue}}'
    soft: '{{mix(base.background, ansi.blue, 25)}}'
    bright: '{{bright.blue}}'
  secondary:
    base: '{{ansi.magenta}}'
    soft: '{{mix(base.background, ansi.magenta, 25)}}'
    bright: '{{bright.magenta}}'
  tertiary:
    base: '{{ansi.green}}'
    soft: '{{mix(base.background, ansi.green, 25)}}'
    bright: '{{bright.green}}'
status:
  success: '{{ansi.green}}'
  warning: '{{ansi.yellow}}'
  error: '{{ansi.red}}'
  urgent: '{{bright.red}}'
ui:
  cursor: '{{ansi.red}}'
  text: '{{base.foreground}}'
  text_secondary: '{{base.foreground_muted}}'
  selection_bg: '{{accent.primary.base}}'
  selection_fg: '{{base.background}}'
  panel: '{{base.surface}}'
  border: '{{accent.primary.base}}'
  border_inner: '{{base.foreground_dim}}'
  border_soft: '{{accent.primary.soft}}'
  highlight: '{{accent.primary.bright}}'
