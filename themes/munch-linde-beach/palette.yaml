# Inspired by Edvard Munch; see SOURCES.md for the artwork and palette decisions.
base:
  background: '#141b17'
  layer0: '{{base.background}}'
  layer1: '#1a231e'
  layer2: '#212b25'
  layer3: '#29342d'
  layer4: '#313d35'
  surface_soft: '{{base.layer1}}'
  surface: '{{base.layer2}}'
  surface_alt: '{{base.layer4}}'
  foreground: '#f1ebdd'
  foreground_muted: '#d5cfc2'
  foreground_dim: '#b9b4a8'
ansi:
  black: '#141b17'
  red: '#fa866e'
  green: '#74c97e'
  yellow: '#e8c27a'
  blue: '#9ab4e0'
  magenta: '#e6a0b0'
  cyan: '#86c8c0'
  white: '#ddd7ca'
bright:
  black: '#b9b4a8'
  red: '#ffa28c'
  green: '#aee6a8'
  yellow: '#f8d89c'
  blue: '#b8ccf6'
  magenta: '#ffbccb'
  cyan: '#a8e0d8'
  white: '#fdf9ee'
accent:
  primary:
    base: '{{ansi.red}}'
    soft: '{{mix(base.background, ansi.red, 25)}}'
    bright: '{{bright.red}}'
  secondary:
    base: '{{ansi.green}}'
    soft: '{{mix(base.background, ansi.green, 25)}}'
    bright: '{{bright.green}}'
  tertiary:
    base: '{{ansi.yellow}}'
    soft: '{{mix(base.background, ansi.yellow, 25)}}'
    bright: '{{bright.yellow}}'
status:
  success: '{{ansi.green}}'
  warning: '{{ansi.yellow}}'
  error: '{{ansi.red}}'
  urgent: '{{bright.red}}'
ui:
  cursor: '{{accent.primary.base}}'
  text: '{{base.foreground}}'
  text_secondary: '{{base.foreground_muted}}'
  selection_bg: '{{accent.primary.base}}'
  selection_fg: '{{base.background}}'
  panel: '{{base.surface}}'
  border: '{{accent.primary.base}}'
  border_inner: '{{base.foreground_dim}}'
  border_soft: '{{accent.primary.soft}}'
  highlight: '{{accent.primary.bright}}'
