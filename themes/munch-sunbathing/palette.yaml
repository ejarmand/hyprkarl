# Inspired by Edvard Munch; see SOURCES.md for the artwork and palette decisions.
base:
  background: '#151a2a'
  layer0: '{{base.background}}'
  layer1: '#1b2134'
  layer2: '#22293e'
  layer3: '#2a3248'
  layer4: '#323b53'
  surface_soft: '{{base.layer1}}'
  surface: '{{base.layer2}}'
  surface_alt: '{{base.layer4}}'
  foreground: '#f3ebe6'
  foreground_muted: '#d8d0cb'
  foreground_dim: '#bcb6b2'
ansi:
  black: '#151a2a'
  red: '#f48e70'
  green: '#92d27c'
  yellow: '#f0d468'
  blue: '#86a8f6'
  magenta: '#f0a8c0'
  cyan: '#6fd0d8'
  white: '#e0d8d3'
bright:
  black: '#bcb6b2'
  red: '#ffac92'
  green: '#b0e89c'
  yellow: '#fce88c'
  blue: '#aac2ff'
  magenta: '#ffc4d6'
  cyan: '#94e6ec'
  white: '#fffaf6'
accent:
  primary:
    base: '{{ansi.blue}}'
    soft: '{{mix(base.background, ansi.blue, 25)}}'
    bright: '{{bright.blue}}'
  secondary:
    base: '{{ansi.magenta}}'
    soft: '{{mix(base.background, ansi.magenta, 25)}}'
    bright: '{{bright.magenta}}'
  tertiary:
    base: '{{ansi.yellow}}'
    soft: '{{mix(base.background, ansi.yellow, 25)}}'
    bright: '{{bright.yellow}}'
status:
  success: '{{ansi.green}}'
  warning: '{{ansi.yellow}}'
  error: '{{ansi.red}}'
  urgent: '{{bright.red}}'
ui:
  cursor: '{{accent.primary.base}}'
  text: '{{base.foreground}}'
  text_secondary: '{{base.foreground_muted}}'
  selection_bg: '{{accent.primary.base}}'
  selection_fg: '{{base.background}}'
  panel: '{{base.surface}}'
  border: '{{accent.primary.base}}'
  border_inner: '{{base.foreground_dim}}'
  border_soft: '{{accent.primary.soft}}'
  highlight: '{{accent.primary.bright}}'
