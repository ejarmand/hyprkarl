# Merged with the user's prompt by hk-starship-reload.
# Cream text sits on dark segment fills. Green, red and purple are prompt glyphs.
[palettes.hyprkarl]
color_fg0 = '{{base.foreground}}'
color_fg1 = '{{base.foreground}}'
color_fg2 = '{{accent.primary.bright}}'
color_bg1 = '{{base.background}}'
color_bg3 = '{{base.layer1}}'
color_magenta = '{{ansi.magenta}}'
color_purple = '{{bright.magenta}}'
color_orange = '{{mix(base.background, ansi.red, 30)}}'
color_yellow = '{{mix(base.background, ansi.yellow, 30)}}'
color_aqua = '{{mix(base.background, ansi.cyan, 30)}}'
color_blue = '{{mix(base.background, ansi.blue, 30)}}'
color_green = '{{bright.green}}'
color_red = '{{bright.red}}'
