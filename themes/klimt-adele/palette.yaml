# Portrait of Adele Bloch-Bauer II. Artwork-inspired colours adapted for dark desktop contrast.
base:
  background: '#17231f'
  layer0: '{{base.background}}'
  layer1: '#202e28'
  layer2: '#2a3932'
  layer3: '#304137'
  layer4: '#37483e'
  surface_soft: '{{base.layer1}}'
  surface: '{{base.layer2}}'
  surface_alt: '{{base.layer4}}'
  foreground: '#eee8db'
  foreground_muted: '#cfcdc0'
  foreground_dim: '#afb7ac'
ansi:
  black: '#17231f'
  red: '#efa59a'
  green: '#b4ca9b'
  yellow: '#dfcb8d'
  blue: '#a6bdcd'
  magenta: '#d7a8bd'
  cyan: '#9dc8bf'
  white: '#dad8cc'
bright:
  black: '#afb7ac'
  red: '#ffc1b4'
  green: '#cedeaf'
  yellow: '#f1dfa6'
  blue: '#c1d3e1'
  magenta: '#efc4d6'
  cyan: '#b8e0d5'
  white: '#fff5e5'
accent:
  primary:
    base: '{{ansi.green}}'
    soft: '{{mix(base.background, ansi.green, 25)}}'
    bright: '{{bright.green}}'
  secondary:
    base: '{{ansi.red}}'
    soft: '{{mix(base.background, ansi.red, 25)}}'
    bright: '{{bright.red}}'
  tertiary:
    base: '{{ansi.magenta}}'
    soft: '{{mix(base.background, ansi.magenta, 25)}}'
    bright: '{{bright.magenta}}'
status:
  success: '{{ansi.green}}'
  warning: '{{ansi.yellow}}'
  error: '{{ansi.red}}'
  urgent: '{{bright.red}}'
ui:
  cursor: '{{accent.primary.bright}}'
  text: '{{base.foreground}}'
  text_secondary: '{{base.foreground_muted}}'
  selection_bg: '{{accent.primary.base}}'
  selection_fg: '{{base.background}}'
  panel: '{{base.surface}}'
  border: '{{accent.primary.base}}'
  border_inner: '{{base.foreground_dim}}'
  border_soft: '{{accent.primary.soft}}'
  highlight: '{{accent.primary.bright}}'
