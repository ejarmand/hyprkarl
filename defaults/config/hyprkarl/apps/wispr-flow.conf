# Wispr Flow for Linux with a locally built helper swapped in. To change this,
# copy it to ~/.config/hyprkarl/apps/, edit the copy, then run:
# hk-app config-update wispr-flow
repo=wispr-flow-linux/wispr-flow-linux
# Renderer accessibility exposes the Hub's buttons over AT-SPI, which
# hk-wispr-word-add presses.
args=(--force-renderer-accessibility)
# Builds the helper from the vendor/wispr-flow-helper submodule; export
# WISPR_HELPER_SRC=/path/to/checkout here to build another one.
post_install=hk-wispr-helper-install
# Login links (wispr-flow://) route here via mimeapps.list; the release's
# desktop entry doesn't declare the scheme.
desktop_entry=('MimeType=x-scheme-handler/wispr-flow;')
