# Voice commands for hk-voice-command.
#
# Hyprkarl ships this file. To change it, copy it to
# ~/.config/hyprkarl/voice-commands.conf, which then replaces it entirely.
#
# Each line is: <phrase> = <command>
#
# A command runs only when the WHOLE transcript matches its phrase, so a
# dictated sentence that merely contains "focus left" is pasted as text.
# Matching ignores case and punctuation ("Focus left." matches "focus left").
# The first matching line wins.
#
# Placeholders:
#   <n>     one number, spoken or written ("three" or "3")
#   <text>  everything after the phrase's fixed words (must come last)
# Using a placeholder in the command passes on what was spoken; <text:url> gives
# <text> with spaces as + for search URLs. Spoken text arrives lowercase, without
# punctuation.
# Commands run directly, not through a shell (no pipes, no $VARS; ~/ works).
# hk-voice-keys sends keys and text to the focused app (see that script).
#
# Commands under an [app <class>] header apply only while that app is focused
# (the class is a regex; `hyprctl activewindow` shows an app's class) and win
# over global commands with the same phrase. [global] switches back.
# "paste with = KEYS" in an app section pastes dictation into that app with
# KEYS instead of the helper's Ctrl+V (for terminals).
# "complete <word> = <trigger> <accept keys>" in an app section turns "<word>
# <name>" anywhere in a dictation into the app's picker: e.g. with
# "complete mention = @ Tab", "thanks mention alice" pastes "thanks ", opens the
# @ picker on "alice" and presses Tab to take the top match.
# "complete <word> from = DIR..." limits the picker to the names of DIRs'
# subdirectories: "<word>" then opens it only when the next words name one
# ("skill pr ping pong" types $pr-ping-pong; "this skill is" stays text). It
# accepts a near miss ("skill crilling" -> grilling) and "<word>s".
#
# "## Title" lines name each group in the cheat sheet ("cheat sheet", or
# Utilities > Voice Commands in the menu).
#
# Uncomment to require a leading word before every command:
# leader = computer

## Help
cheat sheet = hk-shell menu open voice-commands
voice commands = hk-shell menu open voice-commands
what can i say = hk-shell menu open voice-commands

## Launch apps
# Starts the app whose name is or starts with the spoken words; with no single
# match, opens the launcher
launch <text> = hk-voice-launch <text>
open <text> = hk-voice-launch <text>

## Wispr dictionary
# Wispr's dictionary: opens "Add to vocabulary" with the cursor in the word
# field. "fix spelling" sets it up as a correction: type the word Wispr
# produced, then the right one.
add to dictionary = hk-wispr-word-add
fix spelling = hk-wispr-word-add --correction
# Save the dictionary to ~/.config/hyprkarl/wispr-dictionary.csv (Wispr's import format)
back up dictionary = hk-wispr-dictionary
backup dictionary = hk-wispr-dictionary
# Export all dictations + recordings to ~/Documents/wispr-exports/ for review
export transcripts = hk-wispr-transcripts

## Workspaces
# Workspaces
workspace <n> = hyprctl dispatch hl.dsp.focus({workspace=<n>})

## Tabs
# Tabs inside the focused app (Ctrl+Tab / Ctrl+Shift+Tab)
tab next = hk-voice-keys CTRL+Tab
next tab = hk-voice-keys CTRL+Tab
tab back = hk-voice-keys CTRL+SHIFT+Tab
previous tab = hk-voice-keys CTRL+SHIFT+Tab

## Window focus
# Window focus
focus left = hyprctl dispatch hl.dsp.focus({direction="l"})
focus right = hyprctl dispatch hl.dsp.focus({direction="r"})
focus up = hyprctl dispatch hl.dsp.focus({direction="u"})
focus down = hyprctl dispatch hl.dsp.focus({direction="d"})

## Send
# End a dictation with one of these to paste it and then press Enter
# ("Looks good to me, send it."). Said on their own, the commands below apply.
send suffix = send it
send suffix = press enter

## Line breaks between dictations
# Consecutive dictations into the same window start on a new line (Wispr trims
# leading whitespace, so it cannot do this itself): line, paragraph or off.
# Another window or any voice command in between starts fresh.
join with = line
line mode = hk-voice-command --join-mode line
paragraph mode = hk-voice-command --join-mode paragraph
inline mode = hk-voice-command --join-mode off
default mode = hk-voice-command --join-mode config

## Send
# Press Enter in the focused app (send a chat message, run a command)
send = hk-voice-keys Return
send it = hk-voice-keys Return
press enter = hk-voice-keys Return
submit = hk-voice-keys Return

## Web search
# Web search from any app (new tab in the default browser)
search <text> = hk-browser-launch https://www.google.com/search?q=<text:url>
web search <text> = hk-browser-launch https://www.google.com/search?q=<text:url>

## Chrome
[app google-chrome|chromium|brave-browser]
search <text> = hk-voice-keys CTRL+L type:<text> Return
new tab <text> = hk-voice-keys CTRL+T type:<text> Return
new tab = hk-voice-keys CTRL+T
close tab = hk-voice-keys CTRL+W
find <text> = hk-voice-keys CTRL+F type:<text>
go back = hk-voice-keys ALT+Left
go forward = hk-voice-keys ALT+Right

## Terminal
# Terminals paste with Ctrl+Shift+V (Ctrl+V stays free for Neovim's block select)
[app com.mitchellh.ghostty|kitty|foot|alacritty]
paste with = CTRL+SHIFT+V
join with = off
interrupt = hk-voice-keys CTRL+C
control c = hk-voice-keys CTRL+C
clear screen = hk-voice-keys CTRL+L
previous command = hk-voice-keys Up
next command = hk-voice-keys Down
tab complete = hk-voice-keys Tab

## T3 Code
# T3 Code (keys from ~/.t3/userdata/keybindings.json; mod = Ctrl). Its threads
# are the "tabs"; "web search" still reaches Google from here. More specific
# phrases go first: the first matching line wins.
[app com.t3tools.T3Code]
complete skill = $ Tab
complete skill from = ~/.claude/skills ~/.agents/skills
search project <text> = hk-voice-keys CTRL+SHIFT+F type:<text>
find file <text> = hk-voice-keys CTRL+P type:<text>
search = hk-voice-keys CTRL+K
search <text> = hk-voice-keys CTRL+K type:<text>
tab next = hk-voice-keys CTRL+SHIFT+bracketright
next thread = hk-voice-keys CTRL+SHIFT+bracketright
tab back = hk-voice-keys CTRL+SHIFT+bracketleft
previous thread = hk-voice-keys CTRL+SHIFT+bracketleft
thread <n> = hk-voice-keys CTRL+<n>
new thread = hk-voice-keys CTRL+N

## Discord
# Discord (Vesktop): "mention <name>" picks the user from Discord's @ list
[app vesktop|discord]
complete mention = @ Tab
