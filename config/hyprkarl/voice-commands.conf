# Voice commands for hyprkarl-voice-command.
#
# Each line is: <phrase> = <command>
#
# A command runs only when the WHOLE transcript matches its phrase, so a
# dictated sentence that merely contains "focus left" is pasted as text.
# Matching ignores case and punctuation ("Focus left." matches "focus left").
# The first matching line wins.
#
# Placeholders:
#   <n>     one number, spoken or written ("three" or "3")
#   <text>  everything after the phrase's fixed words (must come last)
# Using a placeholder in the command passes on what was spoken; <text:url> gives
# <text> with spaces as + for search URLs. Spoken text arrives lowercase, without
# punctuation.
# Commands run directly, not through a shell (no pipes, no $VARS; ~/ works).
# hyprkarl-voice-keys sends keys and text to the focused app (see that script).
#
# Commands under an [app <class>] header apply only while that app is focused
# (the class is a regex; `hyprctl activewindow` shows an app's class) and win
# over global commands with the same phrase. [global] switches back.
# "paste with = KEYS" in an app section pastes dictation into that app with
# KEYS instead of the helper's Ctrl+V (for terminals).
# "complete <word> = <trigger> <accept keys>" in an app section turns "<word>
# <name>" anywhere in a dictation into the app's picker: e.g. with
# "complete mention = @ Tab", "thanks mention alice" pastes "thanks ", opens the
# @ picker on "alice" and presses Tab to take the top match.
#
# "## Title" lines name each group in the cheat sheet ("cheat sheet" /
# hyprkarl-menu-voice-commands).
#
# Uncomment to require a leading word before every command:
# leader = computer

## Help
cheat sheet = hyprkarl-menu-voice-commands
voice commands = hyprkarl-menu-voice-commands
what can i say = hyprkarl-menu-voice-commands

## Launch apps
# Launcher: fills rofi with the spoken name and launches it if there's one match
launch <text> = rofi -show drun -theme ~/.config/rofi/launcher.rasi -filter <text> -auto-select
open <text> = rofi -show drun -theme ~/.config/rofi/launcher.rasi -filter <text> -auto-select

## Wispr dictionary
# Wispr's dictionary: opens "Add to vocabulary" as a correction, cursor in
# Misspelling. Type the word Wispr produced, then the right one.
add to dictionary = hyprkarl-wispr-add-word

## Workspaces
# Workspaces
workspace <n> = hyprctl dispatch workspace <n>

## Tabs
# Tabs inside the focused app (Ctrl+Tab / Ctrl+Shift+Tab)
tab next = hyprctl dispatch sendshortcut CTRL, Tab, activewindow
next tab = hyprctl dispatch sendshortcut CTRL, Tab, activewindow
tab back = hyprctl dispatch sendshortcut CTRL SHIFT, Tab, activewindow
previous tab = hyprctl dispatch sendshortcut CTRL SHIFT, Tab, activewindow

## Window focus
# Window focus
focus left = hyprctl dispatch movefocus l
focus right = hyprctl dispatch movefocus r
focus up = hyprctl dispatch movefocus u
focus down = hyprctl dispatch movefocus d

## Send
# End a dictation with one of these to paste it and then press Enter
# ("Looks good to me, send it."). Said on their own, the commands below apply.
send suffix = send it
send suffix = press enter

## Line breaks between dictations
# Consecutive dictations into the same window start on a new line (Wispr trims
# leading whitespace, so it cannot do this itself): line, paragraph or off.
# Another window or any voice command in between starts fresh.
join with = line
line mode = hyprkarl-voice-command --join-mode line
paragraph mode = hyprkarl-voice-command --join-mode paragraph
inline mode = hyprkarl-voice-command --join-mode off
default mode = hyprkarl-voice-command --join-mode config

## Send
# Press Enter in the focused app (send a chat message, run a command)
send = hyprkarl-voice-keys Return
send it = hyprkarl-voice-keys Return
press enter = hyprkarl-voice-keys Return
submit = hyprkarl-voice-keys Return

## Web search
# Web search from any app (new tab in the default browser)
search <text> = hyprkarl-launch-browser https://www.google.com/search?q=<text:url>
web search <text> = hyprkarl-launch-browser https://www.google.com/search?q=<text:url>

## Chrome
[app google-chrome|chromium|brave-browser]
search <text> = hyprkarl-voice-keys CTRL+L type:<text> Return
new tab <text> = hyprkarl-voice-keys CTRL+T type:<text> Return
new tab = hyprkarl-voice-keys CTRL+T
close tab = hyprkarl-voice-keys CTRL+W
find <text> = hyprkarl-voice-keys CTRL+F type:<text>
go back = hyprkarl-voice-keys ALT+Left
go forward = hyprkarl-voice-keys ALT+Right

## Terminal
# Terminals paste with Ctrl+Shift+V (Ctrl+V stays free for Neovim's block select)
[app com.mitchellh.ghostty|kitty|foot|alacritty]
paste with = CTRL+SHIFT+V
join with = off
interrupt = hyprkarl-voice-keys CTRL+C
control c = hyprkarl-voice-keys CTRL+C
clear screen = hyprkarl-voice-keys CTRL+L
previous command = hyprkarl-voice-keys Up
next command = hyprkarl-voice-keys Down
tab complete = hyprkarl-voice-keys Tab

## T3 Code
# T3 Code (keys from ~/.t3/userdata/keybindings.json; mod = Ctrl). Its threads
# are the "tabs"; "web search" still reaches Google from here. More specific
# phrases go first: the first matching line wins.
[app com.t3tools.T3Code]
complete skill = $ Tab
search project <text> = hyprkarl-voice-keys CTRL+SHIFT+F type:<text>
find file <text> = hyprkarl-voice-keys CTRL+P type:<text>
search = hyprkarl-voice-keys CTRL+K
search <text> = hyprkarl-voice-keys CTRL+K type:<text>
tab next = hyprkarl-voice-keys CTRL+SHIFT+bracketright
next thread = hyprkarl-voice-keys CTRL+SHIFT+bracketright
tab back = hyprkarl-voice-keys CTRL+SHIFT+bracketleft
previous thread = hyprkarl-voice-keys CTRL+SHIFT+bracketleft
thread <n> = hyprkarl-voice-keys CTRL+<n>
new thread = hyprkarl-voice-keys CTRL+N

## Discord
# Discord (Vesktop): "mention <name>" picks the user from Discord's @ list
[app vesktop|discord]
complete mention = @ Tab
