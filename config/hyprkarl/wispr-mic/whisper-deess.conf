# Wispr Mic profile: whisper plus a de-esser. Whispered s is loud next to the
# vowels; this tames it, at the risk of blurring s against th. Untuned.
base = whisper
deess:Bypass = 0
deess:High-pass filter frequency (Hz) = 4000
deess:Threshold (G) = 0.063
deess:Ratio = 3
deess:Attack time (ms) = 1
deess:Release time (ms) = 50
