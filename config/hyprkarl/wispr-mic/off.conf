# Wispr Mic profile: flat. Every control in the chain at its neutral value; the
# other profiles are applied on top of this one, so they list only what they
# change. Keep in sync with config/pipewire/pipewire.conf.d/wispr-mic.conf.
#
# Lines are <node>:<control> = <value>, set live by hk-wispr-profile. Controls
# ending in (G) are linear gains: 2.0 = +6 dB, 0.5 = -6 dB, 0.1 = -20 dB.
# `base = <profile>` applies another profile first. PipeWire ignores a
# misspelled control without a warning: copy names exactly from the plugin's
# port list (`analyseplugin` in the ladspa package prints the LSP ones).
hp:Freq = 0
eq:Freq = 5000
eq:Gain = 0
eq:Q = 0.7
gain:Mult = 1
exp:Bypass = 1
deess:Bypass = 1
lim:Bypass = 1
