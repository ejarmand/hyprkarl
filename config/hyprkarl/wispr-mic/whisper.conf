# Wispr Mic profile: close-mic whisper, plain level and shape.
# The floor sits below 500 Hz and the loudest band in whispered speech is
# breath under 150 Hz, so cut that, bring the speech up, turn the gaps down
# gently, and keep the peaks off full scale.

# Breath and plosive blasts
hp:Freq = 160

# Makeup gain, +6 dB. Whispered fricative bursts peak about 28 dB over the
# speech RMS, so on the loudest ones the limiter takes most of this back.
gain:Mult = 2

# Downward expander (mode 0; mode 1 is upward). LSP's detector follows peaks,
# which sit well above a whisper's RMS, so the threshold is higher than the
# floor suggests: -30 dBFS took 10-14 dB off the floor of the benchmark takes
# and nothing measurable off the speech. Fast attack so it opens on the quiet
# onsets of f, th and h; a slow release so it does not chop between syllables.
exp:Bypass = 0
exp:Expander mode = 0
exp:Attack threshold (G) = 0.03
exp:Ratio = 2
exp:Attack time (ms) = 2
exp:Release time (ms) = 150

# Ceiling at -1 dBFS
lim:Bypass = 0
lim:Threshold (G) = 0.891
