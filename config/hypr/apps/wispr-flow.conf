# Wispr Flow status pill. Hyprland maps it as a normal window, so it took
# keyboard focus (dictation pasted into the pill, not your app), and its
# 512x614 transparent window drew a blurred, dimmed box with the small pill at
# its bottom centre. Match on the title it maps with ("Status" comes later, too
# late for map-time rules), keep it out of focus, and park it at the bottom
# centre. Wispr fixes the window size, so a size rule cannot shrink it.
windowrule = tag +wispr-pill, match:initial_title ^(Flow Status Indicator)$
windowrule = tag -default-opacity, match:tag wispr-pill
windowrule = no_focus on, match:tag wispr-pill
windowrule = no_initial_focus on, match:tag wispr-pill
windowrule = pin on, match:tag wispr-pill
windowrule = border_size 0, match:tag wispr-pill
windowrule = no_shadow on, match:tag wispr-pill
windowrule = no_blur on, match:tag wispr-pill
windowrule = move (monitor_w*0.5-window_w*0.5) (monitor_h-window_h-12), match:tag wispr-pill
