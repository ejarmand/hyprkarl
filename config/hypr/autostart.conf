exec-once = bash -c '[ -f "$HOME/.cache/hyprkarl-caffeine" ] || uwsm-app -- hypridle'
exec-once = uwsm-app -- mako
exec-once = uwsm app -- systemctl --user start hyprpolkitagent
exec-once = uwsm app -- waybar
exec-once = uwsm app -- swayosd-server
exec-once = uwsm app -- hyprpaper
exec-once = hyprkarl-wallpaper-init || hyprkarl-wallpaper-cycle

# Slow app launch fix -- set systemd vars
exec-once = systemctl --user import-environment $(env | cut -d'=' -f 1)
exec-once = dbus-update-activation-environment --systemd --all
exec-once = /usr/bin/gnome-keyring-daemon --start --components=secrets


# Prod swayosd to fix sluggish initial response
exec-once = while ! swayosd-client --custom-message "" 2>/dev/null; do sleep 0.2; done

# Wispr Flow in the tray (the launcher adds the accessibility flag that
# hyprkarl-wispr-add-word needs)
exec-once = uwsm app -- ~/.local/bin/wispr-flow --hidden
