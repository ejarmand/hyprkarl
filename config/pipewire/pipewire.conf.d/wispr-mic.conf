# Wispr Mic: a filtered copy of the USB mic for Wispr Flow to record from.
#
# One fixed chain, mono:
#   highpass -> presence EQ -> gain -> expander -> de-esser -> limiter
# hk-wispr-profile switches profiles (config/hyprkarl/wispr-mic/*.conf) by
# setting these controls live, so Wispr's stream is never interrupted. The
# values below are the `off` profile: flat, with the dynamics bypassed. Keep
# them in sync with config/hyprkarl/wispr-mic/off.conf.
#
# Wispr only honors a hand-picked mic whose name contains "(virtual)", so the
# description must keep it. Pick "Wispr Mic (virtual)" in Wispr's mic settings.
#
# The expander, de-esser and limiter are LSP plugins (lsp-plugins-ladspa). If
# they are missing, nofail lets PipeWire start without Wispr Mic.
#
# Edit, then run hk-audio-restart.

context.modules = [
  { name = libpipewire-module-filter-chain
    flags = [ nofail ]
    args = {
      node.description = "Wispr Mic (virtual)"
      media.name       = "Wispr Mic (virtual)"
      filter.graph = {
        nodes = [
          # Breath and plosive blasts sit below ~150 Hz; whisper has nothing there.
          # Off: 0 Hz, an exact pass-through (any real cutoff shifts the phase of
          # the lows, which a flat profile should not).
          { type = builtin name = hp label = bq_highpass
            control = { "Freq" = 0.0 "Q" = 0.707 } }
          # Presence lift for fricatives (Wispr gets 16 kHz audio: nothing above 8k).
          { type = builtin name = eq label = bq_peaking
            control = { "Freq" = 5000.0 "Q" = 0.7 "Gain" = 0.0 } }
          # Makeup gain, linear (2.0 = +6 dB).
          { type = builtin name = gain label = linear
            control = { "Mult" = 1.0 "Add" = 0.0 } }
          # Downward expander: turns down the gaps between words, unlike a gate.
          { type = ladspa name = exp plugin = "lsp-plugins-ladspa"
            label = "http://lsp-plug.in/plugins/ladspa/expander_mono"
            control = { "Bypass" = 1 "Expander mode" = 0 } }
          { type = ladspa name = deess plugin = "lsp-plugins-ladspa"
            label = "http://lsp-plug.in/plugins/ladspa/deesser_mono"
            control = { "Bypass" = 1 } }
          # Brick wall below full scale. Gain boost off: it would add makeup gain.
          { type = ladspa name = lim plugin = "lsp-plugins-ladspa"
            label = "http://lsp-plug.in/plugins/ladspa/limiter_mono"
            control = { "Bypass" = 1 "Gain boost" = 0 "Threshold (G)" = 0.891 } }
        ]
        links = [
          { output = "hp:Out"      input = "eq:In" }
          { output = "eq:Out"      input = "gain:In" }
          { output = "gain:Out"    input = "exp:Input" }
          { output = "exp:Output"  input = "deess:Input" }
          { output = "deess:Output" input = "lim:Input" }
        ]
      }
      audio.channels = 1
      audio.position = [ MONO ]
      capture.props = {
        node.name      = "wispr_mic.capture"
        # The mic, as in hk-wispr-switch ($HK_WISPR_SWITCH_SOURCE).
        target.object  = "alsa_input.usb-0c76_JOUNIVO_MICROPHONE-00.mono-fallback"
        stream.dont-remix = true
        node.passive   = true
      }
      playback.props = {
        node.name   = "wispr_mic"
        media.class = Audio/Source
        # Never become the default source; only Wispr records from this.
        priority.session = 0
        priority.driver  = 0
      }
    }
  }
]
